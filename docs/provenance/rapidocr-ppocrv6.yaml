modifications:
  - "Pinned as a runtime dependency behind Hina's repository-owned OcrProvider; no upstream source file or snippet was copied."
  - "Uses the reviewed RapidOCR 3.9.1 converted PP-OCRv6 small Torch artifacts by exact URL and SHA-256 in a physical repository-local cache."
  - "Forces detector, recognizer and orientation classifier onto CUDA:0, validates every component device and fails closed when CUDA is unavailable; no CPU, ONNX, Paddle or remote fallback is implemented."
  - "Passes a one-shot owner-consented PNG only in memory, returns bounded untrusted text/confidence/normalized boxes and retains neither pixels nor OCR output after the parent 15-second observation expires."
  - "The 2026-07-28 synthetic Vietnamese long-line smoke measured 23.611% CER, so this integration is a functional GPU candidate only and is not quality-promoted."
