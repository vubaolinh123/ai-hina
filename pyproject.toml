[project]
name = "hina-ai"
version = "0.0.0"
description = "Local-first Vietnamese AI VTuber"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
  { name = "Linh Vu" },
]
dependencies = [
  "faster-whisper==1.2.1",
  "f5-tts==1.1.22",
  "moonshine-voice==0.0.73",
  "onnxruntime==1.27.0",
  "qdrant-client==1.18.0",
  "torch==2.11.0+cu128",
  "torchaudio==2.11.0+cu128; python_version == '3.12' and sys_platform == 'win32'",
  "transformers>=4.57,<5",
  "vieneu==3.2.3",
  "voxcpm==2.0.3",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
]

[tool.uv]
package = false
# VoxCPM's inference path does not import datasets/fsspec, while its broad
# training/demo dependency pins older releases that conflict with Hina's
# existing F5/Moonshine environment. Keep Hina's already-tested runtime
# versions and use only the official VoxCPM inference API.
override-dependencies = [
  "datasets==5.0.0",
  "fsspec==2026.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = []
