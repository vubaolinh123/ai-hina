[project]
name = "hina-ai"
version = "0.0.0"
description = "Local-first Vietnamese AI VTuber"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
  { name = "Linh Vu" },
]
dependencies = [
  "faster-whisper==1.2.1",
  "f5-tts==1.1.22",
  "moonshine-voice==0.0.73",
  "omnivoice==0.2.1",
  "onnxruntime==1.27.0",
  "qdrant-client==1.18.0",
  "torch==2.11.0+cu128",
  "torchaudio==2.11.0+cu128; python_version == '3.12' and sys_platform == 'win32'",
  "transformers==5.3.0",
  "vieneu==3.2.3",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
]

[tool.uv]
package = false
# Hina only uses the inference paths of the retained experimental F5 adapter.
# Keep the already-tested dataset/filesystem pair instead of letting optional
# training/demo dependencies downgrade the shared desktop environment.
override-dependencies = [
  "datasets==5.0.0",
  "fsspec==2026.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = []
