[project]
name = "hina-perception"
version = "0.1.0"
description = "Owner-consented screen snapshot ingestion, freshness/TTL ledger and GPU OCR provider for Hina AI"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "rapidocr==3.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hina_perception"]
